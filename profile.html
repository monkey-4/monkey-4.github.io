<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정제현 - Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Premium dark space background matching main */
            background: linear-gradient(135deg, #090a0f, #1f1c2c, #928DAB); 
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            /* Push the text card to the right side of screen */
            justify-content: flex-end; 
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 📸 Photo on the absolute LEFT edge */
        .profile-image-container {
            position: absolute;
            left: 8%; /* Explicitly moved to the left side */
            top: 50%;
            transform: translateY(-50%);
            width: 420px;
            height: 580px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 20px 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideInLeft 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translate(-100px, -50%); }
            to { opacity: 1; transform: translate(0, -50%); }
        }

        .profile-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        
        .profile-image-container img:hover {
            transform: scale(1.08); /* Zoom effect when checking out the photo */
        }

        /* 📋 Details Card on the RIGHT */
        .profile-card {
            background: rgba(255, 255, 255, 0.05); /* Glassmorphism */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: -20px 30px 60px rgba(0, 0, 0, 0.4);
            border-radius: 40px; 
            padding: 5rem 6rem;
            width: 45%;
            max-width: 800px;
            animation: slideInRight 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            margin-right: 8%; /* Spaced from the right edge */
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFB75E, #ED8F03);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        p {
            font-size: 1.4rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 3.5rem;
            word-break: keep-all;
            max-width: 500px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 40px;
            border-radius: 30px;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #FFB75E, #ED8F03);
            color: #1a0b2e;
            transform: scale(1.05) translateY(-3px);
            border-color: transparent;
            box-shadow: 0 15px 30px rgba(237, 143, 3, 0.4);
        }

        /* Adjustments for Mobile screens */
        @media (max-width: 1000px) {
            body, html {
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                overflow-y: auto;
                padding: 40px 0;
            }
            .profile-image-container {
                position: relative;
                top: auto;
                transform: none;
                left: auto;
                width: 85%;
                max-width: 400px;
                height: 400px;
                margin-top: 0;
                margin-bottom: -50px; /* Overlaps securely with the card below */
                z-index: 20;
            }
            .profile-card {
                width: 90%;
                margin-right: 0;
                padding: 6rem 3rem 4rem 3rem;
                text-align: center;
            }
            p {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    
    <!-- Photo aligned strictly to the LEFT -->
    <div class="profile-image-container" style="cursor: pointer;" onclick="window.location.href='secret.html'">
        <img src="Gemini_Generated_Image_kzd05okzd05okzd0.png" alt="정제현 프로필 사진">
    </div>
    
    <!-- Profile text Card on the RIGHT -->
    <div class="profile-card">
        <h1>정제현</h1>
        <p>안녕하세요! 저의 자기소개 페이지에 오신 것을 환영합니다. <br>이곳에서는 저의 포트폴리오와 다양한 작업물을 확인하실 수 있습니다.</p>
        <a href="index.html" class="back-btn">⬅ 메인으로 돌아가기</a>
    </div>

</body>
</html>
