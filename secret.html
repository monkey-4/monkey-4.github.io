<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!!! APOCALYPSE !!!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #2b0000;
            animation: bgBurn 0.2s infinite alternate;
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        @keyframes bgBurn {
            0% { background-color: #4a0000; }
            100% { background-color: #1a0000; }
        }

        /* 🌌 Aurora Overlay */
        .aurora {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 40% 50%, rgba(0, 255, 128, 0.5), transparent 50%),
                radial-gradient(circle at 60% 30%, rgba(0, 255, 255, 0.4), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(128, 0, 255, 0.5), transparent 50%);
            filter: blur(80px);
            animation: auroraWaft 20s infinite linear alternate, auroraHue 10s infinite linear;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        @keyframes auroraWaft {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.3) translate(10%, 10%); }
            100% { transform: rotate(-10deg) scale(1) translate(-10%, -10%); }
        }
        @keyframes auroraHue {
            0% { filter: blur(80px) hue-rotate(0deg); }
            100% { filter: blur(80px) hue-rotate(360deg); }
        }

        /* 🔥 Flames Effect at the Bottom */
        .flames {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            height: 300px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,100 C20,80 30,10 50,60 C70,10 80,80 100,100 Z" fill="red" opacity="0.8"/><path d="M0,100 C30,90 40,20 60,70 C80,20 90,90 100,100 Z" fill="orange" opacity="0.6"/><path d="M0,100 C10,70 20,40 50,80 C70,40 90,70 100,100 Z" fill="yellow" opacity="0.4"/></svg>') repeat-x;
            background-size: 200px 200px;
            animation: flicker 0.1s infinite alternate, moveFlame 1.5s linear infinite;
            filter: blur(4px) contrast(1.5) brightness(1.5);
            z-index: 3;
            pointer-events: none;
        }
        @keyframes flicker {
            0% { opacity: 0.7; transform: scaleY(1); filter: hue-rotate(0deg) blur(4px); }
            100% { opacity: 1; transform: scaleY(1.6); filter: hue-rotate(-20deg) blur(2px) brightness(2); }
        }
        @keyframes moveFlame {
            0% { background-position: 0 0; }
            100% { background-position: 200px 0; }
        }

        /* ⚡ Lightning Flash Screen Overlay */
        #lightning {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
        }

        /* ☢️ Nuclear Whiteout Flash */
        #nuke-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 1005;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }

        /* Glitch Container strictly naked */
        .glitch-container {
            position: relative;
            z-index: 20;
            padding: 40px;
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff9900, 0 0 60px #ffff00;
            animation: pulseText 0.15s infinite alternate;
            margin-bottom: 20px;
        }

        p {
            font-size: 2rem;
            color: #ffffdd;
            margin-top: 20px;
            font-weight: 900;
            text-shadow: 0 0 15px #ff0000;
            animation: txtShake 0.1s infinite;
        }

        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 30px #ff0000, 0 0 50px #ff9900; }
            100% { transform: scale(1.1); text-shadow: 0 0 50px #ff0000, 0 0 100px #ffff00; }
        }
        
        @keyframes txtShake {
            0% { transform: translate(3px, 2px); }
            50% { transform: translate(-2px, 3px); }
            100% { transform: translate(2px, -3px); }
        }

        .back-btn {
            background: rgba(255, 0, 0, 0.4);
            border: 3px solid #ff0000;
            padding: 15px 50px;
            border-radius: 10px;
            color: white;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            margin-top: 40px;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 0 30px #ff0000;
            position: relative;
            z-index: 100;
        }

        .back-btn:hover {
            background: #ff0000;
            box-shadow: 0 0 50px #ff0000, 0 0 100px #ff9900;
            transform: scale(1.15);
        }

        /* Explosions caught in Hurricane Wind! */
        .ronaldo-explode {
            position: absolute;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: burstRonaldo var(--duration) cubic-bezier(.08,.82,.17,1) forwards;
            z-index: 25;
            white-space: nowrap;
        }

        @keyframes burstRonaldo {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; filter: brightness(3); }
            20% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(2) rotate(var(--rot)); opacity: 1; text-shadow: 0 0 40px #fff; }
            100% { transform: translate(calc(-50% + var(--dx) + var(--wind)), 110vh) scale(0.3) rotate(calc(var(--rot) * 4)); opacity: 0; }
        }

        /* ☢️ Nuke CSS */
        .nuke-shockwave {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: transparent;
            border: 20px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            z-index: 1002;
            pointer-events: none;
        }
        .nuke-cloud {
            position: absolute;
            bottom: 20%; left: 50%;
            width: 150px; height: 150px;
            background: radial-gradient(circle, #ffffff, #ffaa00 30%, #ff0000 80%, transparent);
            border-radius: 50%;
            transform: translate(-50%, 50%) scale(0);
            filter: blur(10px) contrast(1.5) brightness(2);
            opacity: 0;
            z-index: 1001;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        @keyframes shockwaveAnim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; border-width: 50px; }
            100% { transform: translate(-50%, -50%) scale(500); opacity: 0; border-width: 0px; }
        }
        @keyframes nukeCloudAnim {
            0% { transform: translate(-50%, 50%) scale(0); opacity: 1; filter: blur(5px) brightness(3); }
            30% { transform: translate(-50%, 0%) scale(15); opacity: 1; filter: blur(20px) brightness(2); }
            100% { transform: translate(-50%, -30%) scale(25); opacity: 0; filter: blur(40px) brightness(0.5); }
        }

        /* Screen shakes */
        .shake {
            animation: screenShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Extreme Nuke Shake */
        .nuke-shake {
            animation: nukeShakeAnim 3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20% { transform: translate3d(15px, -10px, 0); }
            40% { transform: translate3d(-15px, 12px, 0); }
            60% { transform: translate3d(12px, -15px, 0); }
            80% { transform: translate3d(-12px, 10px, 0); }
        }

        @keyframes nukeShakeAnim {
            0%, 100% { transform: translate3d(0, 0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate3d(30px, -20px, 0) scale(1.05); filter: contrast(1.5); }
            20%, 40%, 60%, 80% { transform: translate3d(-30px, 20px, 0) scale(1.05); filter: contrast(1.5); }
        }
    </style>
</head>
<body>

    <!-- 🌌 Aurora Background -->
    <div class="aurora"></div>

    <!-- 🔥 Flames & ⚡ Lightning -->
    <div class="flames"></div>
    <div id="lightning"></div>
    
    <!-- ☢️ Nuclear Flash Fullscreen Cover -->
    <div id="nuke-flash"></div>
    
    <div id="explosion-layer" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none;"></div>

    <div class="glitch-container">
        <h1>APOCALYPSE</h1>
        <p>☢️ 오로라와 핵분열의 시대! SIUUUUUUU! 💥</p>
        <a href="profile.html" class="back-btn">탈출하기</a>
    </div>

    <script>
        // --- ⚡ Lightning Engine ---
        function strikeLightning() {
            const l = document.getElementById('lightning');
            l.style.opacity = 1; 
            setTimeout(() => l.style.opacity = 0, 30); 
            setTimeout(() => { 
                l.style.opacity = 0.9; 
                setTimeout(() => l.style.opacity = 0, 60); 
            }, 80);
            
            setTimeout(strikeLightning, Math.random() * 3000 + 500); 
            
            // Standard small shake
            if (!document.body.classList.contains('nuke-shake')) {
                document.body.classList.remove('shake');
                void document.body.offsetWidth;
                document.body.classList.add('shake');
            }
        }
        strikeLightning();

        // --- ☢️ Nuclear Detonation Engine ---
        function detonateNuke() {
            // Flash screen solid white
            const flash = document.getElementById('nuke-flash');
            flash.style.opacity = '1';
            
            setTimeout(() => { 
                flash.style.transition = 'opacity 3s ease'; 
                flash.style.opacity = '0'; 
            }, 100);
            
            setTimeout(() => { 
                flash.style.transition = 'opacity 0.1s ease-out'; 
            }, 3100); // Reset transition

            // Spawn Shockwave
            const shock = document.createElement('div');
            shock.className = 'nuke-shockwave';
            shock.style.animation = 'shockwaveAnim 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
            document.body.appendChild(shock);
            setTimeout(() => shock.remove(), 2000);

            // Spawn Mushroom Cloud
            const cloud = document.createElement('div');
            cloud.className = 'nuke-cloud';
            cloud.style.animation = 'nukeCloudAnim 6s ease-out forwards';
            // Randomly drop nukes at different X coordinates
            const nukeX = Math.random() * 80 + 10;
            cloud.style.left = `${nukeX}%`;
            document.body.appendChild(cloud);
            setTimeout(() => cloud.remove(), 6000);

            // Violent Nuke Screen Shake
            document.body.classList.remove('shake');
            document.body.classList.remove('nuke-shake');
            void document.body.offsetWidth;
            document.body.classList.add('nuke-shake');

            // Trigger another nuke randomly between 5 to 15 seconds
            setTimeout(detonateNuke, Math.random() * 10000 + 5000); 
        }
        // First nuke detonates exactly 2 seconds into entering the room
        setTimeout(detonateNuke, 2000);


        // --- 🌪️ Hurricane Wind Speed Lines Engine ---
        function runWind() {
            let line = document.createElement('div');
            line.style.position = 'absolute';
            line.style.background = 'linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent)';
            line.style.height = (Math.random() * 4 + 1) + 'px';
            line.style.width = (Math.random() * 500 + 200) + 'px';
            line.style.left = '-600px'; 
            line.style.top = Math.random() * 100 + 'vh';
            line.style.zIndex = Math.random() > 0.5 ? 200 : 1;
            line.style.pointerEvents = 'none';

            let dur = Math.random() * 0.3 + 0.1; 
            line.style.transition = `transform ${dur}s linear`;
            document.body.appendChild(line);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    line.style.transform = `translateX(180vw)`;
                });
            });

            setTimeout(() => {
                line.remove();
            }, dur * 1000 + 50);
        }
        setInterval(runWind, 10); 

        // --- 💥 Infinite Ronaldo/Wind Explosion Engine ---
        const texts = ['호날두!!', 'SIUUUU!!', '⚽', '💥', '🐐', 'CR7', '🌪️', '🔥', '☢️'];
        const colors = ['#ffffff', '#ffaa00', '#ff0000', '#ffff00', '#ff5500', '#00ff88'];
        const explosionLayer = document.getElementById('explosion-layer');

        function triggerExplosion() {
            if (!document.body.classList.contains('nuke-shake')) {
                document.body.classList.remove('shake');
                void document.body.offsetWidth;
                document.body.classList.add('shake');
            }

            const originX = Math.random() * 70; 
            const originY = Math.random() * 60 + 10; 
            
            const burstAmount = Math.floor(Math.random() * 25) + 20; 

            for(let i = 0; i < burstAmount; i++) {
                let el = document.createElement('div');
                el.innerText = texts[Math.floor(Math.random() * texts.length)];
                el.className = 'ronaldo-explode';
                el.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                el.style.left = `${originX}vw`;
                el.style.top = `${originY}vh`;

                const dx = (Math.random() - 0.5) * 80; 
                const dy = (Math.random() - 0.5) * 100 - 50; 
                
                const windForce = Math.random() * 120 + 150; 
                const rot = (Math.random() - 0.5) * 3000; 
                const duration = Math.random() * 1.5 + 0.6; 
                const size = Math.random() * 5 + 2; 

                el.style.setProperty('--dx', `${dx}vw`);
                el.style.setProperty('--dy', `${dy}vh`);
                el.style.setProperty('--wind', `${windForce}vw`); 
                el.style.setProperty('--rot', `${rot}deg`);
                el.style.setProperty('--duration', `${duration}s`);
                el.style.fontSize = `${size}rem`;

                el.style.textShadow = `0 0 20px ${el.style.color}, 0 0 50px ${el.style.color}`;

                explosionLayer.appendChild(el);

                setTimeout(() => {
                    if(el && el.parentNode) el.remove();
                }, duration * 1000);
            }
        }

        setInterval(triggerExplosion, 400); 
        triggerExplosion();
    </script>
</body>
</html>
